name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test with race detector
        run: go test ./... -race -count=1

      - name: demo runs clean
        run: go run ./cmd/demo

      - name: build for arm64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: test
        working-directory: typescript
        run: node --experimental-strip-types --test test/*.test.ts

      - name: demo runs clean
        working-directory: typescript
        run: node --experimental-strip-types src/demo.ts
